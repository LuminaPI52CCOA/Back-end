spring.application.name=backend
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

jwt.validity=3600
jwt.secret=${JWT_SECRET:}
jwt.cookie.secure=false
gemini.api.key=test-gemini-key
aws.access-key=test-key
aws.secret-key=test-secret
aws.region=us-east-1

alexa.client-id=${ALEXA_CLIENT_ID:test-client-id}
alexa.client-secret=${ALEXA_CLIENT_SECRET:test-client-secret}
alexa.api-endpoint=https://api.amazonalexa.com
alexa.lwa.client-id=${ALEXA_LWA_CLIENT_ID:test-client-id}
alexa.lwa.client-secret=${ALEXA_LWA_CLIENT_SECRET:test-client-secret}
alexa.reminders.enabled=${ALEXA_REMINDERS_ENABLED:false}
