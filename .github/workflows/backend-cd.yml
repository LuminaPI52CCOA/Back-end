name: "Backend CD (Push to ECR & Auto-Deploy via Watchtower)"

on:
  push:
    branches: [ "main", "develop" ]
  workflow_dispatch:
    inputs:
      aws_region:
        description: "Região AWS"
        required: false
        default: "us-east-1"
        type: string

jobs:
  deploy:
    name: "Build JAR e Push no ECR"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Java 21 com Cache Maven
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Compilar Aplicação
        run: mvn clean package -DskipTests

      - name: Autenticar na AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ inputs.aws_region || 'us-east-1' }}

      - name: Autenticar no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build da Imagem Docker
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/lumina-backend:latest .

      - name: Push para o ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/lumina-backend:latest

      - name: Conclusão
        run: echo "✅ Imagem enviada ao ECR com sucesso! O Watchtower na EC2 atualizará a aplicação em até 20 segundos."
