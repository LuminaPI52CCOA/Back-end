# ==============================================================================
# Fluent Bit Configuration - Lumina Project (Logs -> S3 Bronze Tier)
# ==============================================================================

[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf
    HTTP_Server  On
    HTTP_Listen  0.0.0.0
    HTTP_Port    2020
    Storage.path /tmp/fluent-bit/storage
    Storage.sync normal

# ==============================================================================
# 1. INPUTS (Coleta das Fontes de Log)
# ==============================================================================

# Fonte 1: Logs dos Containers Docker da Aplicação
[INPUT]
    Name             tail
    Tag              containers.docker
    Path             /var/lib/docker/containers/*/*.log,/var/log/containers/*.log
    Parser           docker
    Mem_Buf_Limit    10MB
    Refresh_Interval 5
    Skip_Long_Lines  On
    DB               /tmp/fluent-bit/tail-containers.db

# Fonte 2: Logs do Nginx (Proxy Reverso e Frontend)
[INPUT]
    Name             tail
    Tag              nginx.access
    Path             /var/log/nginx/access.log,/var/log/nginx/*.log
    Parser           nginx_combined
    Mem_Buf_Limit    5MB
    Refresh_Interval 5
    DB               /tmp/fluent-bit/tail-nginx.db

# Fonte 3: Logs da Aplicação Backend (Spring Boot)
[INPUT]
    Name             tail
    Tag              app.backend
    Path             /var/log/backend/*.log
    Parser           spring_boot
    Mem_Buf_Limit    10MB
    Refresh_Interval 5
    DB               /tmp/fluent-bit/tail-backend.db

# Fonte 4: Logs de Autenticação e Sistema Operacional (SSH, sudo, auth)
[INPUT]
    Name             tail
    Tag              system.auth
    Path             /var/log/auth.log,/var/log/system.log
    Parser           syslog
    Mem_Buf_Limit    5MB
    Refresh_Interval 5
    DB               /tmp/fluent-bit/tail-system.db

# ==============================================================================
# 2. FILTERS (Enriquecimento e Metadados)
# ==============================================================================

[FILTER]
    Name         record_modifier
    Match        *
    Record       project lumina
    Record       tier bronze
    Record       environment ${ENVIRONMENT:-dev}

# ==============================================================================
# 3. OUTPUTS (Destinos no Amazon S3 - Camada Bronze)
# ==============================================================================

# Destino 1: Logs dos Containers -> /logs/containers/
[OUTPUT]
    Name            s3
    Match           containers.*
    region          ${AWS_REGION:-us-east-1}
    bucket          ${BUCKET_BRONZE}
    total_file_size 10M
    upload_timeout  1m
    use_put_object  On
    compression     gzip
    s3_key_format   /logs/containers/%Y/%m/%d/$TAG-$UUID.json.gz
    store_dir       /tmp/fluent-bit/s3

# Destino 2: Logs do Nginx -> /logs/nginx/
[OUTPUT]
    Name            s3
    Match           nginx.access
    region          ${AWS_REGION:-us-east-1}
    bucket          ${BUCKET_BRONZE}
    total_file_size 10M
    upload_timeout  1m
    use_put_object  On
    compression     gzip
    s3_key_format   /logs/nginx/%Y/%m/%d/$TAG-$UUID.json.gz
    store_dir       /tmp/fluent-bit/s3

# Destino 3: Logs da Aplicação Backend -> /logs/backend/
[OUTPUT]
    Name            s3
    Match           app.backend
    region          ${AWS_REGION:-us-east-1}
    bucket          ${BUCKET_BRONZE}
    total_file_size 10M
    upload_timeout  1m
    use_put_object  On
    compression     gzip
    s3_key_format   /logs/backend/%Y/%m/%d/$TAG-$UUID.json.gz
    store_dir       /tmp/fluent-bit/s3

# Destino 4: Logs do Sistema Operacional -> /logs/system_auth/
[OUTPUT]
    Name            s3
    Match           system.auth
    region          ${AWS_REGION:-us-east-1}
    bucket          ${BUCKET_BRONZE}
    total_file_size 10M
    upload_timeout  1m
    use_put_object  On
    compression     gzip
    s3_key_format   /logs/system_auth/%Y/%m/%d/$TAG-$UUID.json.gz
    store_dir       /tmp/fluent-bit/s3

# Destino Local de Verificação (Console / Dry-run em desenvolvimento)
[OUTPUT]
    Name            stdout
    Match           *
    Format          json_lines
